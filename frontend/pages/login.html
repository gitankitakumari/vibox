<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OTP Login | VIBOX</title>
    
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
   </head>
<body>

<div class="login-container">
    <div class="login-box">

        <!-- Header -->
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-cube"></i>
                <h1>VIB<span>OX</span></h1>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in with OTP to continue to your vibox.in account</p>
        </div>

        <!-- Main Form - Pure OTP Authentication -->
        <form class="login-form" id="loginForm" novalidate>
            <!-- EMAIL FIELD -->
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                <div id="emailError" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </div>
            </div>

            <!-- OTP GROUP -->
            <div class="form-group">
                <label for="otp">
                    <i class="fas fa-mobile-alt"></i>
                    One-Time Password (OTP)
                </label>
                <div class="otp-wrapper">
                    <input type="text" 
                           id="otp" 
                           placeholder="Enter 6-digit OTP" 
                           maxlength="6" 
                           autocomplete="off"
                           required>
                    <button type="button" class="send-otp" id="sendOtpBtn">
                        <i class="fas fa-paper-plane"></i> Send OTP
                    </button>
                </div>
                <div id="otpTimerMessage" class="otp-timer" style="display: none;">
                    <i class="fas fa-hourglass-half"></i> 
                    <span id="timerText">Resend OTP in 60s</span>
                </div>
                <div id="otpError" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </div>
            </div>

            <!-- Remember me section -->
            <div class="remember-me">
                <input type="checkbox" id="rememberCheckbox">
                <label for="rememberCheckbox">
                    <i class="fas fa-check-circle"></i> Remember this device
                </label>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                Verify & Login
            </button>
        </form>

        <!-- Social Login Options -->
        <div class="divider">
            <span>or continue with</span>
        </div>
        <div class="social-login">
            <button class="social-btn google" id="mockGoogleBtn"><i class="fab fa-google"></i> Google</button>
            <button class="social-btn facebook" id="mockFbBtn"><i class="fab fa-facebook-f"></i> Facebook</button>
        </div>

        <!-- Signup Link -->
        <div class="signup-link">
            Don't have an account? <a href="#">Sign up now</a>
        </div>

        <!-- Guest Option -->
        <div class="guest-option">
            <a href="#" id="guestLink">
                <button type="button" class="guest-btn">
                    <i class="fas fa-user-clock"></i>
                    Continue as Guest
                </button>
            </a>
            <p class="guest-note">
                <i class="fas fa-info-circle"></i>
                Limited features available
            </p>
        </div>
    </div>
</div>
<script src="../js/settings.js"></script>

</body>
</html>
