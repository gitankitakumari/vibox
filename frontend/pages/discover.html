<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover | VI-BOX</title>
    <link rel="stylesheet" href="../css/discover.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="discover-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>VI-BOX</h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
                    <li class="active"><a href="discover.html"><i class="fas fa-compass"></i><span>Discover</span></a></li>
                    <li><a href="trending.html"><i class="fas fa-chart-line"></i><span>Trending</span></a></li>
                    <li><a href="album.html"><i class="fas fa-compact-disc"></i><span>Albums</span></a></li>
                    <li><a href="playlist.html"><i class="fas fa-list"></i><span>Playlists</span></a></li>
                    <li><a href="favorite.html"><i class="fas fa-heart"></i><span>Favorites</span></a></li>
                    <li><a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <img src="https://picsum.photos/40/40?random=1" alt="User">
                    <div class="user-info">
                        <h4>Music Lover</h4>
                        <p>Discover New Music</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="discover-header">
                <h1><i class="fas fa-compass"></i> Discover</h1>
                <p>Explore new songs, artists, and playlists</p>
            </header>

            <!-- Search -->
            <div class="search-section">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search songs, artists...">
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="category-tab active" data-category="all">All</button>
                <button class="category-tab" data-category="artist">Artists</button>
                <button class="category-tab" data-category="song">Songs</button>
                <button class="category-tab" data-category="playlist">Playlists</button>
            </div>

            <!-- Trending Section -->
            <div class="section">
                <div class="section-header">
                    <h2><i class="fas fa-fire"></i> Trending Now</h2>
                    <a href="#" class="view-all">View All</a>
                </div>
                <div id="trendingGrid" class="cards-grid"></div>
            </div>

            <!-- Recommended Section -->
            <div class="section">
                <div class="section-header">
                    <h2><i class="fas fa-star"></i> Recommended For You</h2>
                    <a href="#" class="view-all">View All</a>
                </div>
                <div id="recommendedGrid" class="cards-grid"></div>
            </div>
        </main>
    </div>

    <!-- Now Playing Bar -->
    <div class="now-playing-bar" id="nowPlayingBar">
        <div class="now-playing-content">
            <div class="track-info">
                <img id="npCover" src="https://picsum.photos/45/45" alt="cover">
                <div class="track-details">
                    <h4 id="npTitle">Select a song</h4>
                    <p id="npArtist">--</p>
                </div>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="prevBtn"><i class="fas fa-backward"></i></button>
                <button class="control-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fas fa-forward"></i></button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="../js/discover.js"></script>
</body>
</html>
